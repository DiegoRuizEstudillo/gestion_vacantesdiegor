<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Mi Perfil</h2>
        <a th:href="@{/auth/aspirante/bienvenida}" class="btn btn-secondary">← Volver</a>
    </div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Información Personal</h5>
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Nombre:</strong> <span th:text="${aspirante.nombre}">Nombre</span></p>
                    <p><strong>Correo:</strong> <span th:text="${aspirante.correo}">Correo</span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Habilidades:</strong></p>
                    <p th:text="${aspirante.habilidades}">Habilidades del aspirante</p>
                </div>
            </div>

            <div class="mt-4">
                <button class="btn btn-primary">Editar Perfil</button>
                <button class="btn btn-outline-secondary">Cambiar Contraseña</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
