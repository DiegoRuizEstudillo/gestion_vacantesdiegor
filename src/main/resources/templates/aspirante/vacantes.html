<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vacantes Disponibles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Vacantes Disponibles</h2>
        <a th:href="@{/auth/aspirante/bienvenida}" class="btn btn-secondary">← Volver</a>
    </div>

    <!-- Mensajes de éxito/error -->
    <div th:if="${param.success != null}" class="alert alert-success">
        <span th:text="${param.success}">Postulación exitosa</span>
    </div>
    <div th:if="${param.error != null}" class="alert alert-danger">
        <span th:text="${param.error}">Error en la postulación</span>
    </div>

    <div th:if="${vacantes.empty}" class="alert alert-info">
        No hay vacantes disponibles en este momento.
    </div>

    <div th:each="vacante : ${vacantes}" class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${vacante.titulo}">Título</h5>
            <p class="card-text" th:text="${vacante.descripcion}">Descripción</p>
            <p><strong>Salario:</strong> $<span th:text="${vacante.salario}">0</span></p>
            <p><strong>Ubicación:</strong> <span th:text="${vacante.ubicacionId}">Ubicación</span></p>
            <p><strong>Tipo:</strong> <span th:text="${vacante.tipoTrabajo}">Tipo</span></p>
            <p><strong>Empresa:</strong> <span th:text="${vacante.empleador.empresa}">Empresa</span></p>

            <!-- Formulario para postularse -->
            <form th:action="@{/aspirante/postularse}" method="post" class="d-inline">
                <input type="hidden" name="vacanteId" th:value="${vacante.id}">
                <button type="submit" class="btn btn-primary">Postularse</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
