<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenida Aspirante</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        .welcome-container {
            max-width: 800px;
            margin: 4% auto;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(90deg, #198754, #157347);
            color: #fff;
            font-weight: 600;
            font-size: 1.25rem;
            padding: 1rem 1.5rem;
        }
        .btn-custom {
            border-radius: 0.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 0.2rem;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .skills-label {
            font-weight: 500;
            color: #0d6efd;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="welcome-container">
        <div class="card">
            <div class="card-header text-center">
                Bienvenido, Aspirante
            </div>
            <div class="card-body">
                <div class="text-center mb-4">
                    <h5 th:text="${usuario.nombre}">Nombre del Aspirante</h5>
                    <p>Aquí puedes explorar vacantes disponibles y postularte a las que más te interesen.</p>

                    <p class="mt-3">
                        <span class="skills-label">Habilidades:</span>
                        <span th:text="${aspirante.habilidades}">Lista de habilidades</span>
                    </p>
                </div>

                <!-- Botones de funcionalidades -->
                <!-- En la sección de botones, cambia los th:href -->
                <div class="row text-center">
                    <div class="col-md-4 mb-3">
                        <a th:href="@{/aspirante/vacantes}" class="btn btn-primary btn-custom w-100">
                            📋 Ver Vacantes
                        </a>
                    </div>
                    <div class="col-md-4 mb-3">
                        <a th:href="@{/aspirante/solicitudes}" class="btn btn-info btn-custom w-100">
                            📝 Mis Solicitudes
                        </a>
                    </div>
                    <div class="col-md-4 mb-3">
                        <a th:href="@{/aspirante/perfil}" class="btn btn-warning btn-custom w-100">
                            👤 Mi Perfil
                        </a>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <a th:href="@{/auth/logout}" class="btn btn-danger btn-custom">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
