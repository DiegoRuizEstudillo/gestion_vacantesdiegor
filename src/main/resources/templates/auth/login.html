<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Gestión de Vacantes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            max-width: 420px;
            margin: 6% auto;
        }

        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(90deg, #0d6efd, #0b5ed7);
            color: #fff;
            padding: 1rem 1.5rem;
        }

        .card-header h4 {
            margin: 0;
            font-weight: 600;
        }

        .card-body {
            padding: 1.8rem;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-custom {
            font-weight: 500;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .text-muted a {
            text-decoration: none;
        }

        .text-muted a:hover {
            text-decoration: underline;
        }

        hr {
            margin: 1.5rem 0;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="login-container">
        <div class="card">
            <div class="card-header text-center">
                <h4>Iniciar Sesión</h4>
            </div>
            <div class="card-body">

                <!-- Mensaje de error -->
                <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

                <!-- Formulario de inicio de sesión -->
                <form th:action="@{/auth/login}" method="post">
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correo" name="correo" th:value="${correo}" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-custom">Iniciar Sesión</button>
                    </div>

                    <div class="text-center text-muted mb-3">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                </form>

                <hr>

                <div class="text-center mb-3">
                    <small class="text-secondary">¿Aún no tienes una cuenta?</small>
                </div>

                <!-- Botones de registro -->
                <div class="d-grid gap-2 mb-3">
                    <a th:href="@{/auth/registro/aspirante}" class="btn btn-success btn-custom">
                        📝 Registrarse como Aspirante
                    </a>

                    <a th:href="@{/auth/registro/empleador}" class="btn btn-warning btn-custom">
                        💼 Registrarse como Empleador
                    </a>
                </div>

                <!-- Botón de regreso -->
                <div class="d-grid">
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-custom">
                        ← Regresar al Inicio
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
