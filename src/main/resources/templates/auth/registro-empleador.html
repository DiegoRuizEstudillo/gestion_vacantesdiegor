<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Empleador - Gestión de Vacantes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .registro-container {
            max-width: 520px;
            margin: 5% auto;
        }

        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(90deg, #ffc107, #e0a800);
            color: #212529;
            text-align: center;
            font-weight: 600;
            font-size: 1.25rem;
            padding: 1rem 1.5rem;
        }

        .card-body {
            padding: 1.8rem;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-custom {
            border-radius: 0.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .alert {
            border-radius: 0.5rem;
            text-align: center;
        }

        .text-danger.small {
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="registro-container">
        <div class="card">
            <div class="card-header">
                Registro de Empleador
            </div>
            <div class="card-body">

                <!-- Mensajes -->
                <div th:if="${param.registroExitoso}" class="alert alert-success">
                    ¡Registro exitoso! Ahora puedes iniciar sesión.
                </div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- Formulario -->
                <form th:action="@{/auth/registro/empleador}" th:object="${empleador}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required>
                        <div th:if="${#fields.hasErrors('nombre')}" class="text-danger small" th:errors="*{nombre}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" th:field="*{correo}" class="form-control" required>
                        <div th:if="${#fields.hasErrors('correo')}" class="text-danger small" th:errors="*{correo}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña (mínimo 8 caracteres)</label>
                        <input type="password" th:field="*{password}" class="form-control" required>
                        <div th:if="${#fields.hasErrors('password')}" class="text-danger small" th:errors="*{password}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Empresa</label>
                        <input type="text" th:field="*{empresa}" class="form-control"
                               placeholder="Nombre de su empresa" required>
                        <div th:if="${#fields.hasErrors('empresa')}" class="text-danger small" th:errors="*{empresa}"></div>
                    </div>

                    <!-- Botón principal -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-warning btn-custom text-dark">
                            Guardar Registro
                        </button>
                    </div>
                </form>

                <!-- Botón secundario -->
                <div class="d-grid">
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-custom">
                        ← Regresar al Inicio
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
